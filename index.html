const CEREBRAL_ANGIOGRAM_EXACT = new Set([

function classifyProcedure(procRaw) {
  if (!procRaw) return null;
  const rawStr = String(procRaw).trim();
  const pl = rawStr.toLowerCase();

  if (pl.includes("tace")) return "TACE";

  const pClean = rawStr.replace(/,?\s*venogramArm/i, "").trim().replace(/,$/, "").trim();
  const plClean = pClean.toLowerCase();

  if (plClean.includes("avm embolization")) return "AVM Embolization";
  if (plClean.includes("aneurysm coiling") || plClean.includes("aneurysm flow diverter") || plClean.includes("aneurysm stent assisted coiling")) return "Aneurysm Embolization";
  if (plClean.includes("stroke")) return "Stroke";
  if (plClean.includes("pta leg")) return "PTA Leg";
  if (plClean.startsWith("ptv") || plClean.startsWith("venoplasty") || plClean.startsWith("f/u venoplasty") || plClean.startsWith("x-ray venoplasty")) return "Venoplasty";
  if (plClean.includes("cerebral angiogram") || CEREBRAL_ANGIOGRAM_EXACT.has(plClean)) return "Cerebral Angiogram";

  return "Other";
}

function excelDateToJSDate(val) {
  if (val instanceof Date) return val;
  if (typeof val === "number") {
    const utcDays = Math.floor(val - 25569);
    const utcMs = utcDays * 86400 * 1000;
    return new Date(utcMs);
  }
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function median(arr) {
  if (!arr || !arr.length) return null;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function round2(v) { return v === null || v === undefined ? null : Number(Number(v).toFixed(2)); }

// อ่าน raw Dose Report -> รายการ exam
function processRawData(rows) {
  const findKey = (obj, candidates) => {
    const keys = Object.keys(obj);
    for (const c of candidates) {
      const hit = keys.find(k => k.trim().toLowerCase() === c.toLowerCase());
      if (hit) return hit;
    }
    return null;
  };
  if (!rows.length) return { exams: [], warnings: ["ไม่พบข้อมูลในไฟล์"] };

  const sample = rows[0];
  const kA = findKey(sample, ["A#"]);
  const kDate = findKey(sample, ["Date Performed"]);
  const kProc = findKey(sample, ["Procedure"]);
  const kDAP = findKey(sample, ["DAP (Total) Gy-cm2"]);
  const kKar = findKey(sample, ["Reference Point Dose (Total) mGy"]);
  const kMRN = findKey(sample, ["Patient MRN"]);
  const kName = findKey(sample, ["Patient Name"]);
  const kDesc = findKey(sample, ["Description"]);

  const warnings = [];
  if (!kA || !kDate || !kProc || !kDAP) {
    warnings.push("ไม่พบคอลัมน์ที่จำเป็น (A#, Date Performed, Procedure, DAP (Total) Gy-cm2) กรุณาตรวจสอบไฟล์");
    return { exams: [], warnings };
  }

  let parsed = rows.map((r, idx) => {
    const dateVal = excelDateToJSDate(r[kDate]);
    const dap = parseFloat(r[kDAP]);
    const kar = kKar ? parseFloat(r[kKar]) : NaN;
    return {
      _idx: idx,
      examId: r[kA] != null ? String(r[kA]) : null,
      date: dateVal,
      dateStr: dateVal ? dateVal.toISOString().slice(0, 10) : null,
      procedureRaw: r[kProc],
      category: classifyProcedure(r[kProc]),
      dap: isNaN(dap) ? null : dap,
      kar_mGy: isNaN(kar) ? null : kar,
      kar_Gy: isNaN(kar) ? null : kar / 1000,
      mrn: kMRN ? String(r[kMRN] ?? "") : "",
      patientName: kName ? String(r[kName] ?? "") : "",
      description: kDesc ? String(r[kDesc] ?? "") : "",
      _nonNullCount: Object.values(r).filter(v => v !== null && v !== undefined && v !== "").length,
    };
  }).filter(r => r.examId && r.date);

  const byKey = new Map();
  for (const r of parsed) {
    const key = `${r.examId}__${r.dateStr}`;
    const existing = byKey.get(key);
    if (!existing || r._nonNullCount > existing._nonNullCount) {
      byKey.set(key, r);
    }
  }
  const deduped = Array.from(byKey.values());
  const withDap = deduped.filter(r => r.dap !== null);

  // เก็บเฉพาะฟิลด์ที่จำเป็น (ให้บันทึกลง localStorage ได้เล็ก)
  const slim = withDap.map(r => ({
    examId: r.examId, dateStr: r.dateStr, procedureRaw: String(r.procedureRaw ?? ""),
    category: r.category, dap: r.dap, kar_mGy: r.kar_mGy, kar_Gy: r.kar_Gy,
    mrn: r.mrn, patientName: r.patientName, description: r.description,
  }));

  return { exams: slim, warnings, totalRaw: rows.length, totalDeduped: slim.length };
}

// รวม exam จากหลายครั้ง แล้วตัดซ้ำด้วย examId + วันที่
function dedupeExams(exams) {
  const byKey = new Map();
  for (const r of exams) {
    const key = `${r.examId}__${r.dateStr}`;
    if (!byKey.has(key)) byKey.set(key, r);
  }
  return Array.from(byKey.values());
}

function labelToYm(lbl) {
  if (lbl == null) return null;
  const s = String(lbl).trim();
  const idx = s.lastIndexOf("-");
  if (idx < 0) return null;
  const mon = s.slice(0, idx).trim();
  const by2 = s.slice(idx + 1).trim();
  const m = THAI_MON_TO_NUM[mon];
  const n = parseInt(by2, 10);
  if (!m || isNaN(n)) return null;
  const ce = (2500 + n) - 543;
  return `${ce}-${String(m).padStart(2, "0")}`;
}

function monthLabel(ym) {
  const [y, m] = ym.split("-").map(Number);
  const by = toBuddhistYear(y) % 100;
  return `${THAI_MONTHS[m]}-${by}`;
}

function ymToBE(ym) { return toBuddhistYear(Number(ym.slice(0, 4))); }

// อ่าน "ไฟล์สรุปสำเร็จรูป" (มีชีต Monthly_* / Yearly_* / Patient_Ka,r_3Gy)
function parseAggregatedWorkbook(wb) {
  const out = { monthly: {}, yearly: {}, kar: {}, monthsFound: 0 };

  const readSheetRows = (sheet) => {
    // จัด !ref ให้พอดีข้อมูลจริง กัน sheet_to_json ค้าง
    let maxR = 0, maxC = 0, minR = Infinity, minC = Infinity, cellCount = 0;
    for (const addr in sheet) {
      if (addr[0] === "!") continue;
      cellCount++;
      const dec = XLSX.utils.decode_cell(addr);
      if (dec.r > maxR) maxR = dec.r;
      if (dec.c > maxC) maxC = dec.c;
      if (dec.r < minR) minR = dec.r;
      if (dec.c < minC) minC = dec.c;
    }
    if (cellCount > 0) sheet["!ref"] = XLSX.utils.encode_range({ s: { r: minR, c: minC }, e: { r: maxR, c: maxC } });
    return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
  };

  for (const name of wb.SheetNames) {
    const sheet = wb.Sheets[name];
    if (name.indexOf("Monthly_") === 0) {
      const app = EXCEL_TO_APP[name.slice(8)];
      if (!app) continue;
      const rows = readSheetRows(sheet);
      const hi = rows.findIndex(r => r && String(r[0]).trim() === "เดือน/ปี");
      if (hi < 0) continue;
      out.monthly[app] = out.monthly[app] || {};
      for (let i = hi + 1; i < rows.length; i++) {
        const r = rows[i]; if (!r || r[0] == null) continue;
        const ym = labelToYm(r[0]); if (!ym) continue;
        const v = parseFloat(r[1]);
        if (!isNaN(v)) { out.monthly[app][ym] = round2(v); out.monthsFound++; }
      }
    } else if (name.indexOf("Yearly_") === 0) {
      const app = EXCEL_TO_APP[name.slice(7)];
      if (!app) continue;
      const rows = readSheetRows(sheet);
      const hi = rows.findIndex(r => r && String(r[0]).trim() === "ปี พ.ศ.");
      if (hi < 0) continue;
      out.yearly[app] = out.yearly[app] || {};
      for (let i = hi + 1; i < rows.length; i++) {
        const r = rows[i]; if (!r || r[0] == null) continue;
        const be = parseInt(String(r[0]).replace("พ.ศ.", "").trim(), 10);
        const v = parseFloat(r[1]);
        if (!isNaN(be) && !isNaN(v)) out.yearly[app][be] = round2(v);
      }
    } else if (name === "Patient_Ka,r_3Gy") {
      const rows = readSheetRows(sheet);
      const hi = rows.findIndex(r => r && String(r[0]).trim() === "ปี พ.ศ.");
      if (hi < 0) continue;
      for (let i = hi + 1; i < rows.length; i++) {
        const r = rows[i]; if (!r || r[0] == null) continue;
        const be = parseInt(String(r[0]).replace("พ.ศ.", "").trim(), 10);
        const v = parseInt(r[1], 10);
        if (!isNaN(be) && !isNaN(v)) out.kar[be] = v;
      }
    }
  }
  return out;
}

// ===================== ตัวช่วย localStorage =====================
const DB_KEY = "doseWatchDB_v1";
function emptyDB() {
  return { version: 1, addedExams: [], importedMonthly: {}, importedYearly: {}, importedKar: {}, history: [] };
}
function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return emptyDB();
    const obj = JSON.parse(raw);
    return { ...emptyDB(), ...obj };
  } catch (e) { return emptyDB(); }
}
function saveDBtoStorage(db) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
  catch (e) { return false; }
}

// ===================== รวมฐานตั้งต้น + ข้อมูลที่เพิ่ม =====================
function buildMergedMonthly(db) {
  const out = {};
  for (const proc of PROC_ORDER) {
    const map = new Map();
    (BASELINE_MONTHLY[proc] || []).forEach(([ym, v]) => map.set(ym, { MiSIR: v, src: "baseline" }));
    const imp = db.importedMonthly[proc] || {};
    Object.keys(imp).forEach(ym => map.set(ym, { MiSIR: imp[ym], src: "import" }));
    // จาก raw exam
    const grouped = {};
    for (const e of db.addedExams) {
      if (e.category !== proc || !e.dateStr) continue;
      const ym = e.dateStr.slice(0, 7);
      (grouped[ym] = grouped[ym] || []).push(e.dap);
    }
    Object.keys(grouped).forEach(ym => {
      map.set(ym, { MiSIR: round2(median(grouped[ym])), n: grouped[ym].length, src: "raw" });
    });

    const refs = INTL_REFS[proc] || {};
    const rows = [...map.keys()].sort().map(ym => {
      const row = { ym, month: monthLabel(ym), MiSIR: map.get(ym).MiSIR, n: map.get(ym).n, _src: map.get(ym).src };
      for (const [rn, rv] of Object.entries(refs)) row[rn] = rv;
      return row;
    });
    out[proc] = rows;
  }
  return out;
}

function buildMergedYearly(db) {
  const out = {};
  for (const proc of PROC_ORDER) {
    const hasDRL = DRLS_THAILAND.hasOwnProperty(proc);
    const map = new Map();
    (BASELINE_YEARLY[proc] || []).forEach(([be, v]) => map.set(be, v));
    const imp = db.importedYearly[proc] || {};
    Object.keys(imp).forEach(be => map.set(Number(be), imp[be]));
    const grouped = {};
    for (const e of db.addedExams) {
      if (e.category !== proc || !e.dateStr) continue;
      const be = ymToBE(e.dateStr.slice(0, 7));
      (grouped[be] = grouped[be] || []).push(e.dap);
    }
    Object.keys(grouped).forEach(be => map.set(Number(be), round2(median(grouped[be]))));

    const rows = [...map.keys()].sort((a, b) => a - b).map(be => ({
      year: `พ.ศ.${be}`, be, MiSIR: map.get(be), DRLs: hasDRL ? DRLS_THAILAND[proc] : null,
    }));
    out[proc] = rows;
  }
  return out;
}

function buildMergedKar(db) {
  const map = new Map();
  BASELINE_KAR3GY.forEach(([be, c]) => map.set(be, c));
  Object.keys(db.importedKar || {}).forEach(be => map.set(Number(be), db.importedKar[be]));
  const grouped = {};
  for (const e of db.addedExams) {
    if (!e.dateStr || e.kar_Gy == null) continue;
    if (e.kar_Gy >= 3) {
      const be = ymToBE(e.dateStr.slice(0, 7));
      grouped[be] = (grouped[be] || 0) + 1;
    }
  }
  // เฉพาะปีที่มี raw exam จริง จึงจะ override baseline (ป้องกันปีที่ยังไม่มี raw ถูกเขียนเป็น 0)
  const rawYears = {};
  for (const e of db.addedExams) { if (e.dateStr) rawYears[ymToBE(e.dateStr.slice(0,7))] = true; }
  Object.keys(rawYears).forEach(be => map.set(Number(be), grouped[be] || 0));

  return [...map.keys()].sort((a, b) => a - b).map(be => ({ year: `พ.ศ.${be}`, be, count: map.get(be) }));
}

// ===================== รูปกราฟสำหรับฝังใน Excel =====================
async function createChartImageBase64(title, data, refKeys) {
  const canvas = document.createElement("canvas");
  canvas.width = 900; canvas.height = 450;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = "bold 22px 'Inter', sans-serif"; ctx.fillStyle = "#0F3B4D"; ctx.textAlign = "center";
  ctx.fillText(`P50 DAP - ${title}`, canvas.width / 2, 40);
  if (!data || data.length === 0) return canvas.toDataURL("image/png");

  const paddingLeft = 70, paddingRight = 160, paddingTop = 70, paddingBottom = 80;
  const plotWidth = canvas.width - paddingLeft - paddingRight;
  const plotHeight = canvas.height - paddingTop - paddingBottom;

  let maxY = 10;
  data.forEach(d => { if (d.MiSIR && d.MiSIR > maxY) maxY = d.MiSIR; refKeys.forEach(k => { if (d[k] && d[k] > maxY) maxY = d[k]; }); });
  maxY = Math.ceil(maxY * 1.15);

  ctx.strokeStyle = "#EEF2F4"; ctx.lineWidth = 1; ctx.font = "12px sans-serif"; ctx.fillStyle = "#5B6B75"; ctx.textAlign = "right";
  const steps = 5;
  for (let i = 0; i <= steps; i++) {
    const yVal = (maxY / steps) * i;
    const yPos = paddingTop + plotHeight - (i / steps) * plotHeight;
    ctx.beginPath(); ctx.moveTo(paddingLeft, yPos); ctx.lineTo(paddingLeft + plotWidth, yPos); ctx.stroke();
    ctx.fillText(yVal.toFixed(2), paddingLeft - 10, yPos + 4);
  }
  ctx.save(); ctx.translate(20, canvas.height / 2); ctx.rotate(-Math.PI / 2);
  ctx.font = "bold 13px sans-serif"; ctx.fillText("DAP (Gy cm2)", 0, 0); ctx.restore();

  const stepX = data.length > 1 ? plotWidth / (data.length - 1) : plotWidth / 2;
  refKeys.forEach(rk => {
    ctx.strokeStyle = REF_COLORS[rk] || "#888888"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]); ctx.beginPath();
    data.forEach((d, idx) => {
      const x = paddingLeft + (data.length === 1 ? plotWidth / 2 : idx * stepX);
      const val = d[rk] !== undefined ? d[rk] : INTL_REFS[title]?.[rk];
      if (val !== undefined) { const y = paddingTop + plotHeight - (val / maxY) * plotHeight; if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    });
    ctx.stroke(); ctx.setLineDash([]);
  });

  ctx.strokeStyle = MISIR_BLUE; ctx.lineWidth = 2.5; ctx.beginPath();
  data.forEach((d, idx) => {
    const x = paddingLeft + (data.length === 1 ? plotWidth / 2 : idx * stepX);
    if (d.MiSIR !== null && d.MiSIR !== undefined) { const y = paddingTop + plotHeight - (d.MiSIR / maxY) * plotHeight; if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
  });
  ctx.stroke();

  data.forEach((d, idx) => {
    const x = paddingLeft + (data.length === 1 ? plotWidth / 2 : idx * stepX);
    ctx.save(); ctx.translate(x, paddingTop + plotHeight + 15); ctx.rotate(-Math.PI / 4);
    ctx.font = "11px sans-serif"; ctx.fillStyle = "#1A2733"; ctx.textAlign = "right"; ctx.fillText(d.month, 0, 0); ctx.restore();
    if (d.MiSIR !== null && d.MiSIR !== undefined) {
      const y = paddingTop + plotHeight - (d.MiSIR / maxY) * plotHeight;
      ctx.fillStyle = MISIR_BLUE; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
    }
  });

  const legendX = canvas.width - paddingRight + 20; let legendY = paddingTop + 10;
  ctx.font = "12px sans-serif"; ctx.textAlign = "left";
  ctx.strokeStyle = MISIR_BLUE; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(legendX, legendY); ctx.lineTo(legendX + 20, legendY); ctx.stroke();
  ctx.fillStyle = MISIR_BLUE; ctx.beginPath(); ctx.arc(legendX + 10, legendY, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#1A2733"; ctx.fillText("MiSIR", legendX + 28, legendY + 4); legendY += 24;
  refKeys.forEach(rk => {
    ctx.strokeStyle = REF_COLORS[rk] || "#888888"; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]); ctx.beginPath();
    ctx.moveTo(legendX, legendY); ctx.lineTo(legendX + 20, legendY); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#1A2733"; ctx.fillText(rk, legendX + 28, legendY + 4); legendY += 22;
  });
  return canvas.toDataURL("image/png");
}

  const procs = Object.keys(DRLS_THAILAND).filter(p => (drlMonthExceedances[p] || []).length > 0);
  return (
    <ReportPage>
      <ReportHeading>ปริมาณรังสีที่ผู้ป่วยได้รับในหัตถการต่าง ๆ ที่มีค่ามากกว่าปริมาณรังสีอ้างอิง (DRLs) ของประเทศไทย</ReportHeading>
      <ReportSub>ช่วง {monthLabel(fromYm)} – {monthLabel(toYm)} (ค่า P50 DAP รายเดือน)</ReportSub>
      {procs.length === 0 ? (
        <div style={{ padding: 50, textAlign: "center", color: "#8494A0" }}>ไม่มีเดือนใดในช่วงเวลาที่เลือกที่ค่า P50 DAP เกิน DRLs</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 22, marginTop: 10 }}>
          {procs.map(proc => (
            <div key={proc} style={{ minWidth: 240 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: REPORT_NAVY, marginBottom: 2 }}>หัตถการ {proc}</div>
              <div style={{ fontSize: 11, color: "#8494A0", marginBottom: 6 }}>DRLs ประเทศไทย = {DRLS_THAILAND[proc].toFixed(2)} Gy·cm2</div>
              <table style={{ borderCollapse: "collapse", fontSize: 11.5 }}>
                <thead>
                  <tr style={{ background: REPORT_PINK }}>
                    <th style={{ padding: "5px 12px", textAlign: "left", fontWeight: 700, color: REPORT_NAVY }}>เดือน/ปี</th>
                    <th style={{ padding: "5px 12px", textAlign: "right", fontWeight: 700, color: REPORT_NAVY }}>DAP (Gy·cm2)</th>
                  </tr>
                </thead>
                <tbody>
                  {drlMonthExceedances[proc].map(r => (
                    <tr key={r.ym} style={{ borderBottom: "1px solid #EEF2F4" }}>
                      <td style={{ padding: "5px 12px" }}>{r.month}</td>
                      <td style={{ padding: "5px 12px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, color: REPORT_RED }}>{r.MiSIR.toFixed(2)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}
        </div>
      )}
    </ReportPage>
  );
}

// ---- ผู้ป่วยที่ได้รับ Ka,r >= threshold ----
function ReportKarPage({ threshold, exceedances, karYearlyInRange, fromYm, toYm }) {
  return (
    <ReportPage>
      <ReportHeading>ผู้ป่วยที่ได้รับปริมาณรังสี Reference air kerma (Ka,r) ≥ {threshold} Gy</ReportHeading>
      <ReportSub>ช่วง {monthLabel(fromYm)} – {monthLabel(toYm)} (จากข้อมูล raw exam ที่เพิ่มเข้าระบบ)</ReportSub>

      {karYearlyInRange.length > 0 && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14, justifyContent: "center" }}>
          {karYearlyInRange.map(r => (
            <div key={r.be} style={{ background: "#F8FAFB", border: "1px solid #E2E8ED", borderRadius: 8, padding: "6px 14px", fontSize: 11.5 }}>
              <span style={{ color: "#5B6B75" }}>{r.year}</span>{" "}
              <span style={{ fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace", color: REPORT_NAVY }}>{r.count}</span>{" "}
              <span style={{ color: "#8494A0" }}>ราย</span>
            </div>
          ))}
        </div>
      )}

      {exceedances.length === 0 ? (
        <div style={{ padding: 40, textAlign: "center", color: "#8494A0" }}>ไม่มีผู้ป่วยที่เข้าเกณฑ์ในช่วงเวลาที่เลือก</div>
      ) : (
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
          <thead>
            <tr style={{ background: REPORT_PINK }}>
              {["วันที่", "หัตถการ", "Ka,r (Gy)", "DAP (Gy·cm2)"].map(h => (
                <th key={h} style={{ padding: "7px 14px", textAlign: "left", fontWeight: 700, color: REPORT_NAVY }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {exceedances.slice(0, 22).map((e, i) => (
              <tr key={i} style={{ borderBottom: "1px solid #EEF2F4" }}>
                <td style={{ padding: "6px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{e.dateStr}</td>
                <td style={{ padding: "6px 14px" }}>{e.procedureRaw}</td>
                <td style={{ padding: "6px 14px", fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, color: e.kar_Gy >= 5 ? "#B91C1C" : "#C2410C" }}>{e.kar_Gy.toFixed(2)}</td>
                <td style={{ padding: "6px 14px", fontFamily: "'IBM Plex Mono', monospace", color: "#5B6B75" }}>{e.dap.toFixed(2)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </ReportPage>
  );
}

// ===================== แอปหลัก =====================
function App() {
  const [db, setDb] = useState(() => loadDB());
  const [threshold, setThreshold] = useState(3);
  const [selectedProc, setSelectedProc] = useState("TACE");
  const [dateFrom, setDateFrom] = useState(""); // 'YYYY-MM'
  const [dateTo, setDateTo] = useState("");
  const [showIntlRefs, setShowIntlRefs] = useState(true);
  const [activeTab, setActiveTab] = useState("overview");
  const [viewMode, setViewMode] = useState("dashboard"); // 'manage' | 'dashboard'
  const [loadState, setLoadState] = useState("idle");
  const [errorMsg, setErrorMsg] = useState("");
  const [flash, setFlash] = useState("");
  const fileInputRef = useRef(null);
  const restoreInputRef = useRef(null);

  const commitDb = useCallback((next) => {
    setDb(next);
    const ok = saveDBtoStorage(next);
    if (!ok) setFlash("⚠️ บันทึกลงเครื่องไม่สำเร็จ (พื้นที่ localStorage อาจเต็ม) — แนะนำให้กด 'สำรองข้อมูล' เก็บไฟล์ไว้");
  }, []);

  // ---- นำเข้าไฟล์ (ตรวจว่าเป็น raw หรือ ไฟล์สรุป แล้วเพิ่มแบบสะสม) ----
  const handleFile = useCallback((file) => {
    setLoadState("loading"); setErrorMsg(""); setFlash("");
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array", cellDates: true });
        const isAggregated = wb.SheetNames.some(n => n.indexOf("Monthly_") === 0);

        if (isAggregated) {
          // ---- ไฟล์สรุปสำเร็จรูป ----
          const agg = parseAggregatedWorkbook(wb);
          const next = JSON.parse(JSON.stringify(db));
          for (const proc of Object.keys(agg.monthly)) {
            next.importedMonthly[proc] = { ...(next.importedMonthly[proc] || {}), ...agg.monthly[proc] };
          }
          for (const proc of Object.keys(agg.yearly)) {
            next.importedYearly[proc] = { ...(next.importedYearly[proc] || {}), ...agg.yearly[proc] };
          }
          next.importedKar = { ...(next.importedKar || {}), ...agg.kar };
          next.history = [...(next.history || []), {
            id: Date.now(), kind: "agg", fileName: file.name, addedAt: new Date().toISOString(),
            summary: `ไฟล์สรุป: อัปเดต ${agg.monthsFound} จุดข้อมูลรายเดือน`,
          }];
          commitDb(next);
          setFlash(`✓ เพิ่มข้อมูลจากไฟล์สรุป "${file.name}" แล้ว (อัปเดต ${agg.monthsFound} จุดข้อมูลรายเดือน)`);
          setLoadState("ready");
          setViewMode("dashboard");
        } else {
          // ---- raw Dose Report ----
          const sheetName = wb.SheetNames[0];
          const sheet = wb.Sheets[sheetName];
          let maxR = 0, maxC = 0, minR = Infinity, minC = Infinity, cellCount = 0;
          for (const addr in sheet) {
            if (addr[0] === "!") continue;
            cellCount++;
            const dec = XLSX.utils.decode_cell(addr);
            if (dec.r > maxR) maxR = dec.r; if (dec.c > maxC) maxC = dec.c;
            if (dec.r < minR) minR = dec.r; if (dec.c < minC) minC = dec.c;
          }
          if (cellCount > 0) sheet["!ref"] = XLSX.utils.encode_range({ s: { r: minR, c: minC }, e: { r: maxR, c: maxC } });
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: null });
          const { exams: processed, warnings: w, totalRaw, totalDeduped } = processRawData(rows);
          if (!processed.length) {
            setLoadState("error");
            setErrorMsg("ไม่พบข้อมูลที่อ่านได้ในไฟล์ — ถ้าเป็น raw Dose Report ต้องมีคอลัมน์ A#, Date Performed, Procedure, DAP (Total) Gy-cm2 หรือถ้าเป็นไฟล์สรุปต้องมีชีต Monthly_*");
            return;
          }
          const beforeCount = db.addedExams.length;
          const merged = dedupeExams([...db.addedExams, ...processed]);
          const added = merged.length - beforeCount;
          const next = JSON.parse(JSON.stringify(db));
          next.addedExams = merged;
          const dates = processed.map(e => e.dateStr).filter(Boolean).sort();
          const span = dates.length ? `${dates[0]} ถึง ${dates[dates.length - 1]}` : "-";
          next.history = [...(next.history || []), {
            id: Date.now(), kind: "raw", fileName: file.name, addedAt: new Date().toISOString(),
            summary: `raw report: ${totalDeduped} exam (ช่วง ${span}) — เพิ่มใหม่ ${added} รายการ`,
          }];
          commitDb(next);
          setFlash(`✓ เพิ่มข้อมูลจาก "${file.name}" แล้ว — อ่าน ${totalRaw} แถว, เป็น ${totalDeduped} exam, เพิ่มใหม่ ${added} รายการ (ที่ซ้ำถูกตัดออก)`);
          setLoadState("ready");
          setViewMode("dashboard");
        }
      } catch (err) {
        setLoadState("error");
        setErrorMsg("ไม่สามารถอ่านไฟล์ได้: " + err.message);
      }
    };
    reader.onerror = () => { setLoadState("error"); setErrorMsg("เกิดข้อผิดพลาดขณะอ่านไฟล์"); };
    reader.readAsArrayBuffer(file);
  }, [db, commitDb]);

  const onDrop = useCallback((e) => {
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleFile(file);
  }, [handleFile]);

  // ---- สำรอง / กู้คืน / ล้างข้อมูล ----
  const backupData = useCallback(() => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 10);
    link.download = `dosewatch_backup_${stamp}.json`;
    link.click();
  }, [db]);

  const restoreData = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const obj = JSON.parse(evt.target.result);
        if (!obj || typeof obj !== "object" || !Array.isArray(obj.addedExams)) {
          setFlash("⚠️ ไฟล์สำรองไม่ถูกต้อง"); return;
        }
        const next = { ...emptyDB(), ...obj };
        commitDb(next);
        setFlash(`✓ กู้คืนข้อมูลจากไฟล์สำรองแล้ว (${next.addedExams.length} exam)`);
        setViewMode("dashboard");
      } catch (e) { setFlash("⚠️ อ่านไฟล์สำรองไม่ได้: " + e.message); }
    };
    reader.readAsText(file);
  }, [commitDb]);

  const resetAdded = useCallback(() => {
    if (!window.confirm("ต้องการล้างข้อมูลที่เพิ่มเองทั้งหมดหรือไม่?\n(ฐานข้อมูลตั้งต้นที่ฝังในแอปจะยังอยู่ครบ)")) return;
    commitDb(emptyDB());
    setFlash("✓ ล้างข้อมูลที่เพิ่มเองแล้ว — เหลือเฉพาะฐานข้อมูลตั้งต้น");
  }, [commitDb]);

  // ---- ข้อมูลรวม (baseline + added) ----
  const monthlyAll = useMemo(() => buildMergedMonthly(db), [db]);
  const yearlyAll = useMemo(() => buildMergedYearly(db), [db]);
  const karYearly = useMemo(() => buildMergedKar(db), [db]);

  // ช่วงเดือนที่มี
  const spanYms = useMemo(() => {
    const s = new Set();
    PROC_ORDER.forEach(p => (monthlyAll[p] || []).forEach(r => s.add(r.ym)));
    return [...s].sort();
  }, [monthlyAll]);
  const minYm = spanYms[0] || "2024-10";
  const maxYm = spanYms[spanYms.length - 1] || "2026-07";
  const fromYm = dateFrom || minYm;
  const toYm = dateTo || maxYm;

  const filteredMonthly = useMemo(() => {
    const out = {};
    for (const proc of PROC_ORDER) {
      out[proc] = (monthlyAll[proc] || []).filter(r => r.ym >= fromYm && r.ym <= toYm);
    }
    return out;
  }, [monthlyAll, fromYm, toYm]);

  const addedInRange = useMemo(() => {
    return db.addedExams.filter(e => e.dateStr && e.dateStr.slice(0, 7) >= fromYm && e.dateStr.slice(0, 7) <= toYm);
  }, [db.addedExams, fromYm, toYm]);

  const exceedances = useMemo(() => {
    return addedInRange.filter(e => e.kar_Gy !== null && e.kar_Gy >= threshold).sort((a, b) => b.kar_Gy - a.kar_Gy);
  }, [addedInRange, threshold]);

  const overallStats = useMemo(() => {
    const procCount = {};
    for (const e of addedInRange) { if (!e.category) continue; procCount[e.category] = (procCount[e.category] || 0) + 1; }
    return {
      total: addedInRange.length,
      maxKar: addedInRange.reduce((m, e) => (e.kar_Gy !== null && e.kar_Gy > m ? e.kar_Gy : m), 0),
      procCount,
    };
  }, [addedInRange]);

  const chartData = filteredMonthly[selectedProc] || [];
  const refNames = Object.keys(INTL_REFS[selectedProc] || {});
  const drlValue = DRLS_THAILAND[selectedProc];

  // ---- ข้อมูลสำหรับรายงาน PDF (ตามช่วงเวลาที่เลือก) ----
  const drlMonthExceedances = useMemo(() => {
    const out = {};
    Object.keys(DRLS_THAILAND).forEach(proc => {
      const drl = DRLS_THAILAND[proc];
      out[proc] = (filteredMonthly[proc] || []).filter(r => r.MiSIR !== null && r.MiSIR !== undefined && r.MiSIR > drl);
    });
    return out;
  }, [filteredMonthly]);

  const yearsInRange = useMemo(() => {
    const beFrom = ymToBE(fromYm), beTo = ymToBE(toYm);
    const s = new Set();
    PROC_ORDER.forEach(p => (yearlyAll[p] || []).forEach(r => { if (r.be >= beFrom && r.be <= beTo) s.add(r.be); }));
    return [...s].sort((a, b) => a - b);
  }, [yearlyAll, fromYm, toYm]);

  const overviewByYear = useMemo(() => {
    const out = {};
    yearsInRange.forEach(be => {
      out[be] = PROC_ORDER.map(p => {
        const row = (yearlyAll[p] || []).find(r => r.be === be);
        return { proc: p, MiSIR: row ? row.MiSIR : null, DRLs: DRLS_THAILAND[p] ?? null };
      });
    });
    return out;
  }, [yearlyAll, yearsInRange]);

  const karExceed3 = exceedances; // Ka,r >= threshold (default 3 Gy) รายบุคคล ในช่วงที่เลือก
  const karYearlyInRange = useMemo(() => {
    const beFrom = ymToBE(fromYm), beTo = ymToBE(toYm);
    return karYearly.filter(r => r.be >= beFrom && r.be <= beTo);
  }, [karYearly, fromYm, toYm]);

  // ---- Export Excel ----
  const exportExcel = useCallback(async () => {
    const workbook = new ExcelJS.Workbook();
    workbook.creator = "Dose Watch Dashboard";

    const wsReadme = workbook.addWorksheet("README");
    wsReadme.addRow(["รายงานปริมาณรังสีในหัตถการรังสีร่วมรักษา (สร้างจากแดชบอร์ด)"]);
    wsReadme.addRow([`ช่วงเดือนที่เลือก: ${fromYm} ถึง ${toYm}`]);
    wsReadme.addRow([`ข้อมูลที่เพิ่มเอง (raw exam): ${db.addedExams.length} รายการ`]);
    wsReadme.addRow([]);
    wsReadme.addRow(["Sheet", "เนื้อหา"]);
    wsReadme.addRow(["Exceedances", `รายชื่อผู้ป่วยที่ Ka,r ≥ ${threshold} Gy (จากข้อมูล raw ที่เพิ่มเอง)`]);
    PROC_ORDER.forEach(p => wsReadme.addRow([`Monthly_${p}`, `ข้อมูล P50 DAP รายเดือน และกราฟ - ${p}`]));
    wsReadme.addRow(["Overview", "เปรียบเทียบทุกหัตถการ (ค่าล่าสุดรายปี) กับ DRLs"]);

    const wsExc = workbook.addWorksheet("Exceedances");
    wsExc.addRow(["HN", "ชื่อผู้ป่วย", "วันที่", "หัตถการ", "Ka,r (Gy)", "DAP (Gy·cm2)"]);
    const headerRow = wsExc.getRow(1);
    headerRow.font = { bold: true, color: { argb: "FFFFFF" } };
    headerRow.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "1E4F7A" } };
    exceedances.forEach(e => wsExc.addRow([e.mrn, e.patientName, e.dateStr, e.procedureRaw, Number(e.kar_Gy.toFixed(2)), Number(e.dap.toFixed(2))]));

    for (const proc of PROC_ORDER) {
      const wsName = `Monthly_${proc}`.slice(0, 31);
      const ws = workbook.addWorksheet(wsName);
      const refs = INTL_REFS[proc] || {};
      const refKeys = Object.keys(refs);
      const monthData = filteredMonthly[proc] || [];

      ws.getCell("A1").value = "P50 DAP รายเดือน";
      ws.getCell("A1").font = { name: "Inter", size: 16, bold: true, color: { argb: "0F3B4D" } };
      ws.getCell("A2").value = `หน่วย: Gy·cm2 | ช่วง ${fromYm} ถึง ${toYm}`;
      ws.getCell("A2").font = { name: "Inter", size: 10, italic: true, color: { argb: "5B6B75" } };

      const headers = ["เดือน/ปี", "MiSIR", ...refKeys];
      const hRow = ws.getRow(4);
      headers.forEach((h, colIdx) => {
        const cell = hRow.getCell(colIdx + 1);
        cell.value = h; cell.font = { bold: true, color: { argb: "FFFFFF" } };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "1E4F7A" } };
        cell.alignment = { horizontal: "center", vertical: "middle" };
      });
      monthData.forEach((r, rowIdx) => {
        const row = ws.getRow(5 + rowIdx);
        row.getCell(1).value = r.month; row.getCell(1).alignment = { horizontal: "center" };
        const misirCell = row.getCell(2);
        misirCell.value = r.MiSIR; misirCell.numFmt = "0.00"; misirCell.font = { bold: true };
        refKeys.forEach((rk, kIdx) => { const c = row.getCell(3 + kIdx); c.value = refs[rk]; c.numFmt = "0.00"; });
      });

      const chartBase64 = await createChartImageBase64(proc, monthData, refKeys);
      const imageId = workbook.addImage({ base64: chartBase64, extension: "png" });
      ws.addImage(imageId, { tl: { col: refKeys.length + 3, row: 3 }, ext: { width: 680, height: 350 } });

      ws.getColumn(1).width = 14; ws.getColumn(2).width = 12;
      refKeys.forEach((_, idx) => { ws.getColumn(3 + idx).width = 12; });
    }

    const wsOv = workbook.addWorksheet("Overview");
    wsOv.addRow(["หัตถการ", "MiSIR (ค่าล่าสุดรายปี)", "DRLs (ไทย)"]);
    const ovHRow = wsOv.getRow(1);
    ovHRow.font = { bold: true, color: { argb: "FFFFFF" } };
    ovHRow.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "1E4F7A" } };
    PROC_ORDER.forEach(p => {
      const yr = yearlyAll[p] || [];
      const last = yr.length ? yr[yr.length - 1].MiSIR : null;
      wsOv.addRow([p, last !== null ? Number(last.toFixed(2)) : null, DRLS_THAILAND[p] ?? null]);
    });

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `dose_report_${fromYm}_to_${toYm}.xlsx`;
    link.click();
  }, [exceedances, filteredMonthly, yearlyAll, fromYm, toYm, threshold, db.addedExams.length]);

  const exportPDF = useCallback(() => { window.print(); }, []);

  const importedMonthCount = useMemo(() => {
    const s = new Set();
    Object.values(db.importedMonthly).forEach(m => Object.keys(m).forEach(ym => s.add(ym)));
    return s.size;
  }, [db.importedMonthly]);

  return (
    <div style={{ fontFamily: "'Inter', -apple-system, sans-serif", background: "#EEF2F4", minHeight: "100vh", color: "#1A2733", padding: "0 0 40px 0" }}>

      {/* ============ PRINT-ONLY REPORT (ธีมตามเทมเพลตอ้างอิง) ============ */}
      <div className="print-report">
        <ReportTitlePage fromYm={fromYm} toYm={toYm} yearBE={ymToBE(toYm)} />
        <ReportObjectivesPage />
        <ReportDrlInfoPage />

        <ReportSectionDivider titleLines={["Body", "Intervention"]} items={BODY_PROCS} />
        {BODY_PROCS.map(proc => (
          <React.Fragment key={proc}>
            <ReportMonthlyChartPage proc={proc} monthData={filteredMonthly[proc] || []} drl={DRLS_THAILAND[proc]} rnames={Object.keys(INTL_REFS[proc] || {})} />
            <ReportYearlyChartPage proc={proc} yearData={yearlyAll[proc] || []} hasDRL={DRLS_THAILAND.hasOwnProperty(proc)} />
          </React.Fragment>
        ))}

        <ReportSectionDivider titleLines={["Neuro", "Intervention"]} items={NEURO_PROCS} />
        {NEURO_PROCS.map(proc => (
          <React.Fragment key={proc}>
            <ReportMonthlyChartPage proc={proc} monthData={filteredMonthly[proc] || []} drl={DRLS_THAILAND[proc]} rnames={Object.keys(INTL_REFS[proc] || {})} />
            <ReportYearlyChartPage proc={proc} yearData={yearlyAll[proc] || []} hasDRL={DRLS_THAILAND.hasOwnProperty(proc)} />
          </React.Fragment>
        ))}

        <ReportDrlExceedPage fromYm={fromYm} toYm={toYm} drlMonthExceedances={drlMonthExceedances} />

        {yearsInRange.map(be => (
          <ReportYearOverviewPage key={be} be={be} rows={overviewByYear[be]} />
        ))}

        <ReportKarPage threshold={threshold} exceedances={karExceed3} karYearlyInRange={karYearlyInRange} fromYm={fromYm} toYm={toYm} />
        <ReportKarProtocolPage />

        <ReportPage>
          <ReportHeading>เอกสารอ้างอิง</ReportHeading>
          <div style={{ fontSize: 9.5, lineHeight: 1.85, color: "#3A3A3A", marginTop: 16, columnCount: 1 }}>
            <div>1. Miller DL, Kwon D, Bonavia GH. Reference Levels for Patient Radiation Doses in Interventional Radiology: Proposed Initial Values for U.S. Practice. Radiology 2009 Dec 1;253:753–64.</div>
            <div>2. Etard C, Bigand E, Salvat C, Vidal V, Beregi JP, Hornbeck A, et al. Patient dose in interventional radiology: a multicentre study of the most frequent procedures in France. Eur Radiol 2017 Oct 1;27:4281–90.</div>
            <div>3. Ruiz-Cruces R, Vano E, Carrera-Magariño F, Moreno-Rodriguez F, Soler-Cantos MM, Canis-Lopez M, et al. Diagnostic reference levels and complexity indices in interventional radiology: a national programme. Eur Radiol 2016 Dec 1;26:4268–76.</div>
            <div>4. Schegerer A, Loose R, Heuser LJ, Brix G. Diagnostic Reference Levels for Diagnostic and Interventional X-Ray Procedures in Germany: Update and Handling. Rofo 2019 Aug;191:739–51.</div>
            <div>5. Vano E, Sanchez R, Fernandez JM, Gallego JJ, Verdu JF, de Garay MG, et al. Patient Dose Reference Levels for Interventional Radiology: A National Approach. Cardiovasc Intervent Radiol 2009 Jan 1;32:19–24.</div>
            <div>6. Hassan AE, Amelot S. Radiation Exposure during Neurointerventional Procedures in Modern Biplane Angiographic Systems: A Single-Site Experience. Interv Neurol 2017 Oct;6:105–16.</div>
            <div>7. Diagnostic Reference Levels (DRLs) [Internet]. IAEA; 2017. Available from: https://www.iaea.org/resources/rpop/health-professionals/radiology/diagnostic-reference-levels</div>
            <div>8. โครงการ DRLGen.pdf [Internet]. Available from: http://webapp1.dmsc.moph.go.th/petitionxray/course/download</div>
            <div>9. Jones AK. Establishing a patient safety program in Interventional Radiology. 2013;74.</div>
            <div>10. Stecker MS, Balter S, Towbin RB, Miller DL, Vañó E, Bartal G, et al. Guidelines for Patient Radiation Dose Management. J Vasc Interv Radiol 2009 Jul;20:S263–73.</div>
            <div>11. Liu B, Hirsch JA, Li X, Sheridan RM, Rehani MM, Zheng H, et al. Radiation Dose Monitoring for Fluoroscopically Guided Interventional Procedures: Effect on Patient Radiation Exposure. Radiology 2019 Mar;290:744–9.</div>
            <div>12. Steele JR, Jones AK, Ninan EP. Quality Initiatives: Establishing an Interventional Radiology Patient Radiation Safety Program. RadioGraphics 2011 Dec 30;32:277–87.</div>
            <div>13. radiation_ionizing.pdf [Internet]. Available from: http://www.nst.or.th/article/radiation_ionizing.pdf</div>
          </div>
        </ReportPage>

        <ReportThankYouPage />
      </div>

      {/* ============ SCREEN DASHBOARD ============ */}
      <div className="screen-only">
        <div style={{ background: "linear-gradient(135deg, #0F3B4D 0%, #164E63 100%)", padding: "28px 32px 24px", color: "#fff" }}>
          <div style={{ maxWidth: 1280, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 34, height: 34, borderRadius: 8, background: "rgba(255,255,255,0.12)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <IconActivity size={19} strokeWidth={2.4} color="#7FD4C1" />
              </div>
              <div>
                <div style={{ fontSize: 19, fontWeight: 700, letterSpacing: -0.2 }}>Dose Watch Dashboard</div>
                <div style={{ fontSize: 12.5, color: "#A9C4CE" }}>ปริมาณรังสีในหัตถการรังสีร่วมรักษา — Neuro-IR / Body IR</div>
              </div>
            </div>

            <div style={{ display: "flex", gap: 10 }}>
              <button
                onClick={() => setViewMode("manage")}
                style={{
                  background: viewMode === "manage" ? "rgba(255,255,255,0.25)" : "transparent",
                  color: "#fff", border: "1px solid rgba(255,255,255,0.3)",
                  padding: "7px 14px", borderRadius: 8, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                  display: "flex", alignItems: "center", gap: 6
                }}
              >
                <IconDatabase size={14} color="#fff" /> จัดการข้อมูล
              </button>
              <button
                onClick={() => setViewMode("dashboard")}
                style={{
                  background: viewMode === "dashboard" ? "#7FD4C1" : "transparent",
                  color: viewMode === "dashboard" ? "#0F3B4D" : "#fff",
                  border: viewMode === "dashboard" ? "none" : "1px solid rgba(255,255,255,0.3)",
                  padding: "7px 14px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, cursor: "pointer",
                  display: "flex", alignItems: "center", gap: 6
                }}
              >
                <IconActivity size={14} color={viewMode === "dashboard" ? "#0F3B4D" : "#fff"} /> แดชบอร์ด <IconArrowRight size={13} color={viewMode === "dashboard" ? "#0F3B4D" : "#fff"} />
              </button>
            </div>
          </div>
        </div>

        <div style={{ maxWidth: 1280, margin: "0 auto", padding: "0 32px" }}>

          {flash && (
            <div style={{ marginTop: 16, background: flash.startsWith("⚠️") ? "#FEF2F2" : "#F0FBF7", border: `1px solid ${flash.startsWith("⚠️") ? "#FCA5A5" : "#99E0C9"}`, color: flash.startsWith("⚠️") ? "#B91C1C" : "#0F6B54", borderRadius: 10, padding: "12px 16px", fontSize: 13, fontWeight: 600 }}>
              {flash}
            </div>
          )}

          {/* ========== VIEW: จัดการข้อมูล ========== */}
          {viewMode === "manage" && (
            <div style={{ marginTop: 20 }}>

              {/* กล่องอัปโหลด */}
              <div
                onDrop={onDrop}
                onDragOver={(e) => e.preventDefault()}
                style={{ border: "2px dashed #B8C6CD", borderRadius: 14, background: "#fff", padding: "44px 24px", textAlign: "center", cursor: "pointer" }}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
              >
                <input ref={fileInputRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }}
                  onChange={(e) => e.target.files && e.target.files[0] && handleFile(e.target.files[0])} />
                <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}>
                  <div style={{ width: 56, height: 56, borderRadius: 14, background: "#EAF3F5", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <IconUpload size={26} color="#0F3B4D" strokeWidth={2} />
                  </div>
                </div>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#0F3B4D", marginBottom: 6 }}>
                  {loadState === "loading" ? "กำลังประมวลผล..." : "ลากไฟล์ Excel เดือนใหม่มาวาง หรือคลิกเพื่อเลือกไฟล์"}
                </div>
                <div style={{ fontSize: 13, color: "#7C8B95", maxWidth: 620, margin: "0 auto" }}>
                  รับได้ทั้ง <b>raw Dose Report</b> (มีคอลัมน์ A#, Date Performed, Procedure, DAP…) และ <b>ไฟล์สรุปสำเร็จรูป</b> (มีชีต Monthly_*) — ข้อมูลจะถูก<b>เพิ่มสะสมต่อจากของเดิม</b> โดยอัตโนมัติ
                </div>
                {loadState === "error" && (
                  <div style={{ marginTop: 16, color: "#B91C1C", fontSize: 13.5, fontWeight: 600 }}>{errorMsg}</div>
                )}
              </div>

              {/* สถานะฐานข้อมูล */}
              <div style={{ marginTop: 18, background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", padding: "18px 20px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
                  <IconDatabase size={16} color="#0F3B4D" />
                  <span style={{ fontWeight: 700, fontSize: 14.5 }}>สถานะฐานข้อมูลในแอป</span>
                </div>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <StatCard label="ฐานข้อมูลตั้งต้น (ฝังในแอป)" value={`${BASELINE_MONTH_COUNT} เดือน`} icon={IconDatabase} />
                  <StatCard label="raw exam ที่เพิ่มเอง" value={db.addedExams.length.toLocaleString()} icon={IconActivity} />
                  <StatCard label="เดือนจากไฟล์สรุปที่เพิ่ม" value={importedMonthCount} icon={IconSheet} />
                </div>
                <div style={{ fontSize: 12.5, color: "#5B6B75", marginTop: 14, lineHeight: 1.7 }}>
                  · ฐานข้อมูลตั้งต้น: P50 DAP รายเดือน <b>ต.ค. 2567 – ก.ค. 2569</b>, รายปี <b>พ.ศ. 2563–2569</b> และจำนวนผู้ป่วย Ka,r ≥ 3 Gy <b>พ.ศ. 2560–2569</b> (ลบไม่ได้ อยู่ในแอปเสมอ)<br/>
                  · ข้อมูลที่เพิ่มเองถูกบันทึกไว้ในเครื่องนี้ (เบราว์เซอร์นี้) — เปิดใหม่/ปิดแอปแล้วยังอยู่
                </div>
              </div>

              {/* ปุ่มสำรอง/กู้คืน/ล้าง */}
              <div style={{ marginTop: 16, background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", padding: "16px 20px", display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#5B6B75", marginRight: 4 }}>สำรอง & กู้คืน:</span>
                <button onClick={backupData} style={btnStyle("#0F6B54")}><IconSave size={14} /> สำรองข้อมูล (.json)</button>
                <button onClick={() => restoreInputRef.current && restoreInputRef.current.click()} style={btnStyle("#0F3B4D")}><IconUpload size={14} /> กู้คืนจากไฟล์สำรอง</button>
                <input ref={restoreInputRef} type="file" accept=".json" style={{ display: "none" }}
                  onChange={(e) => e.target.files && e.target.files[0] && restoreData(e.target.files[0])} />
                <div style={{ flex: 1 }} />
                <button onClick={resetAdded} style={{ ...btnStyle("#fff"), color: "#B91C1C", border: "1px solid #FCA5A5" }}><IconTrash size={14} color="#B91C1C" /> ล้างข้อมูลที่เพิ่มเอง</button>
              </div>

              {/* ประวัติการเพิ่มข้อมูล */}
              <div style={{ marginTop: 16, background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", overflow: "hidden" }}>
                <div style={{ padding: "14px 20px", borderBottom: "1px solid #E2E8ED", fontWeight: 700, fontSize: 14 }}>ประวัติการเพิ่มข้อมูล</div>
                {(!db.history || db.history.length === 0) ? (
                  <div style={{ padding: 24, textAlign: "center", color: "#8494A0", fontSize: 13 }}>ยังไม่มีการเพิ่มข้อมูล — แสดงผลจากฐานข้อมูลตั้งต้น</div>
                ) : (
                  <div style={{ overflowX: "auto" }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                      <thead>
                        <tr style={{ background: "#F8FAFB", textAlign: "left" }}>
                          {["เวลา", "ประเภท", "ไฟล์", "รายละเอียด"].map(h => (
                            <th key={h} style={{ padding: "9px 16px", fontWeight: 600, color: "#5B6B75", fontSize: 11, textTransform: "uppercase", letterSpacing: 0.3, borderBottom: "1px solid #E2E8ED" }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {[...db.history].reverse().map((h) => (
                          <tr key={h.id} style={{ borderBottom: "1px solid #EEF2F4" }}>
                            <td style={{ padding: "9px 16px", fontFamily: "'IBM Plex Mono', monospace", color: "#5B6B75", whiteSpace: "nowrap" }}>{(h.addedAt || "").slice(0, 16).replace("T", " ")}</td>
                            <td style={{ padding: "9px 16px" }}>{h.kind === "raw" ? "raw report" : "ไฟล์สรุป"}</td>
                            <td style={{ padding: "9px 16px" }}>{h.fileName}</td>
                            <td style={{ padding: "9px 16px", color: "#5B6B75" }}>{h.summary}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========== VIEW: แดชบอร์ด ========== */}
          {viewMode === "dashboard" && (
            <React.Fragment>
              <div className="no-print" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 20, flexWrap: "wrap", gap: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <IconDatabase size={16} color="#5B6B75" />
                  <span style={{ fontSize: 13, color: "#5B6B75" }}>
                    ฐานตั้งต้น {BASELINE_MONTH_COUNT} เดือน{db.addedExams.length ? ` + เพิ่มเอง ${db.addedExams.length} exam` : ""}{importedMonthCount ? ` + ${importedMonthCount} เดือนจากไฟล์สรุป` : ""}
                  </span>
                  <button onClick={() => setViewMode("manage")} style={{ fontSize: 12, color: "#0F3B4D", background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>เพิ่ม/จัดการข้อมูล</button>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={exportExcel} style={btnStyle("#0F6B54")}><IconSheet size={14} /> ดาวน์โหลด Excel</button>
                  <button onClick={exportPDF} style={btnStyle("#0F3B4D")}><IconFile size={14} /> ดาวน์โหลด PDF</button>
                </div>
              </div>

              <div className="no-print" style={{ marginTop: 18, background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", padding: "14px 18px", display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <IconFilter size={14} color="#5B6B75" />
                  <span style={{ fontSize: 12.5, fontWeight: 600, color: "#5B6B75" }}>ช่วงเดือน</span>
                </div>
                <input type="month" value={fromYm} min={minYm} max={maxYm} onChange={(e) => setDateFrom(e.target.value)} style={dateInputStyle} />
                <span style={{ color: "#B8C6CD" }}>—</span>
                <input type="month" value={toYm} min={minYm} max={maxYm} onChange={(e) => setDateTo(e.target.value)} style={dateInputStyle} />
                <button onClick={() => { setDateFrom(""); setDateTo(""); }} style={{ fontSize: 12, color: "#0F3B4D", background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>ทั้งหมด</button>
                <div style={{ width: 1, height: 24, background: "#E2E8ED" }} />
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 12.5, fontWeight: 600, color: "#5B6B75" }}>เกณฑ์ Ka,r ≥</span>
                  <input type="number" step="0.1" value={threshold} onChange={(e) => setThreshold(parseFloat(e.target.value) || 0)}
                    style={{ ...dateInputStyle, width: 64, fontFamily: "'IBM Plex Mono', monospace" }} />
                  <span style={{ fontSize: 12.5, color: "#5B6B75" }}>Gy</span>
                </div>
              </div>

              <div className="no-print" style={{ display: "flex", gap: 8, marginTop: 18 }}>
                <Pill active={activeTab === "overview"} onClick={() => setActiveTab("overview")}>ภาพรวม & ผู้ป่วยเกินเกณฑ์</Pill>
                <Pill active={activeTab === "chart"} onClick={() => setActiveTab("chart")}>กราฟ DRLs รายเดือน</Pill>
              </div>

              {activeTab === "overview" && (
                <div style={{ marginTop: 18 }}>
                  <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
                    <StatCard label="Exam ที่เพิ่มเอง (ในช่วงเวลา)" value={overallStats.total.toLocaleString()} icon={IconActivity} />
                    <StatCard label={`ผู้ป่วยเกิน ${threshold} Gy`} value={exceedances.length} tone={exceedances.length > 0 ? "alert" : "good"} icon={IconAlert} />
                    <StatCard label="Ka,r สูงสุดที่พบ (ข้อมูลที่เพิ่มเอง)" value={overallStats.maxKar.toFixed(2) + " Gy"} tone={overallStats.maxKar >= threshold ? "alert" : "good"} />
                  </div>

                  {db.addedExams.length === 0 && (
                    <div style={{ marginTop: 16, background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 10, padding: "12px 16px", fontSize: 12.5, color: "#92400E", lineHeight: 1.6 }}>
                      ℹ️ ข้อมูลรายผู้ป่วย (ตารางเกินเกณฑ์ & จำนวน exam) มาจาก <b>raw Dose Report</b> ที่คุณเพิ่มเอง — ตอนนี้ยังไม่มี จึงแสดงเป็น 0<br/>
                      กราฟด้านล่างและแท็บ "กราฟ DRLs รายเดือน" แสดงจาก<b>ฐานข้อมูลตั้งต้น</b>ได้ตามปกติ · จำนวนผู้ป่วย Ka,r ≥ 3 Gy รายปีดูได้จากกราฟด้านล่าง
                    </div>
                  )}

                  {/* กราฟจำนวนผู้ป่วย Ka,r >= 3 Gy รายปี (จากฐานตั้งต้น + ที่เพิ่ม) */}
                  <div style={{ marginTop: 18, background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", padding: "16px 20px" }}>
                    <div style={{ fontWeight: 700, fontSize: 14.5, marginBottom: 4 }}>จำนวนผู้ป่วยที่ได้รับ Ka,r ≥ 3 Gy รายปี (พ.ศ.)</div>
                    <div style={{ fontSize: 12, color: "#8494A0", marginBottom: 8 }}>รวมฐานข้อมูลตั้งต้น + ข้อมูล raw ที่เพิ่มเอง</div>
                    <ResponsiveContainer width="100%" height={260}>
                      <BarChart data={karYearly} margin={{ top: 12, right: 20, left: 0, bottom: 4 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#EEF2F4" vertical={false} />
                        <XAxis dataKey="year" tick={{ fontSize: 11, fill: "#5B6B75" }} />
                        <YAxis allowDecimals={false} tick={{ fontSize: 11, fill: "#5B6B75" }} />
                        <Tooltip contentStyle={{ borderRadius: 8, border: "1px solid #E2E8ED", fontSize: 12.5 }} />
                        <Bar dataKey="count" name="จำนวนผู้ป่วย" fill="#C2410C" radius={[3, 3, 0, 0]} isAnimationActive={false} />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>

                  <div style={{ marginTop: 18, background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", overflow: "hidden" }}>
                    <div style={{ padding: "16px 20px", borderBottom: "1px solid #E2E8ED", display: "flex", alignItems: "center", gap: 8 }}>
                      <IconAlert size={16} color="#B91C1C" />
                      <span style={{ fontWeight: 700, fontSize: 14.5 }}>ผู้ป่วยที่ได้รับ Ka,r ≥ {threshold} Gy</span>
                      <span style={{ fontSize: 12.5, color: "#8494A0" }}>({exceedances.length} ราย)</span>
                    </div>
                    {exceedances.length === 0 ? (
                      <div style={{ padding: 40, textAlign: "center", color: "#8494A0", fontSize: 13.5 }}>ไม่พบผู้ป่วยที่มีค่า Ka,r เกินเกณฑ์ในช่วงเวลานี้ (จากข้อมูล raw ที่เพิ่มเอง)</div>
                    ) : (
                      <div style={{ overflowX: "auto" }}>
                        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                          <thead>
                            <tr style={{ background: "#F8FAFB", textAlign: "left" }}>
                              {["HN", "ชื่อผู้ป่วย", "วันที่", "หัตถการ", "Ka,r (Gy)", "DAP (Gy·cm2)"].map(h => (
                                <th key={h} style={{ padding: "10px 16px", fontWeight: 600, color: "#5B6B75", fontSize: 11.5, textTransform: "uppercase", letterSpacing: 0.3, borderBottom: "1px solid #E2E8ED" }}>{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {exceedances.map((e, i) => (
                              <tr key={i} style={{ borderBottom: "1px solid #EEF2F4" }}>
                                <td style={{ padding: "10px 16px", fontFamily: "'IBM Plex Mono', monospace" }}>{e.mrn || "-"}</td>
                                <td style={{ padding: "10px 16px" }}>{e.patientName || "-"}</td>
                                <td style={{ padding: "10px 16px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>{e.dateStr}</td>
                                <td style={{ padding: "10px 16px" }}>{e.procedureRaw}</td>
                                <td style={{ padding: "10px 16px", fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, color: e.kar_Gy >= 5 ? "#B91C1C" : "#C2410C" }}>{e.kar_Gy.toFixed(2)}</td>
                                <td style={{ padding: "10px 16px", fontFamily: "'IBM Plex Mono', monospace", color: "#5B6B75" }}>{e.dap.toFixed(2)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>

                  <div style={{ marginTop: 18, background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", padding: "16px 20px" }}>
                    <div style={{ fontWeight: 700, fontSize: 14.5, marginBottom: 12 }}>จำนวน exam ต่อหัตถการ (จากข้อมูลที่เพิ่มเอง)</div>
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                      {PROC_ORDER.map(p => (
                        <div key={p} style={{ background: "#F8FAFB", borderRadius: 8, padding: "8px 14px", fontSize: 12.5 }}>
                          <span style={{ color: "#5B6B75" }}>{p}</span>{" "}
                          <span style={{ fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace" }}>{overallStats.procCount[p] || 0}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {activeTab === "chart" && (
                <div style={{ marginTop: 18 }}>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
                    {PROC_ORDER.map(p => (
                      <Pill key={p} active={selectedProc === p} onClick={() => setSelectedProc(p)}>{p}</Pill>
                    ))}
                  </div>

                  <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", padding: "20px 20px 8px", marginBottom: 18 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 15 }}>P50 DAP รายเดือน — {selectedProc}</div>
                        <div style={{ fontSize: 12, color: "#8494A0" }}>
                          {drlValue ? `DRLs ประเทศไทย = ${drlValue.toFixed(2)} Gy·cm2` : "ไม่มีค่า DRLs อ้างอิงสำหรับหัตถการนี้"}
                        </div>
                      </div>
                      {refNames.length > 0 && (
                        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, color: "#5B6B75", cursor: "pointer" }}>
                          <input type="checkbox" checked={showIntlRefs} onChange={(e) => setShowIntlRefs(e.target.checked)} />
                          แสดงเส้นอ้างอิงต่างประเทศ
                        </label>
                      )}
                    </div>

                    {chartData.length === 0 ? (
                      <div style={{ padding: 60, textAlign: "center", color: "#8494A0" }}>ไม่มีข้อมูลในช่วงเวลาที่เลือกสำหรับหัตถการนี้</div>
                    ) : (
                      <ResponsiveContainer width="100%" height={420}>
                        <LineChart data={chartData} margin={{ top: 20, right: 24, left: 8, bottom: 8 }}>
                          <CartesianGrid strokeDasharray="3 3" stroke="#EEF2F4" vertical={false} />
                          <XAxis dataKey="month" tick={{ fontSize: 10, fill: "#5B6B75" }} interval={0} angle={-40} textAnchor="end" height={60} />
                          <YAxis tick={{ fontSize: 11, fill: "#5B6B75" }} label={{ value: "DAP (Gy cm2)", angle: -90, position: "insideLeft", fontSize: 11, fill: "#5B6B75" }} />
                          <Tooltip contentStyle={{ borderRadius: 8, border: "1px solid #E2E8ED", fontSize: 12.5 }} />
                          <Legend wrapperStyle={{ fontSize: 12 }} />
                          {showIntlRefs && refNames.map(rn => (
                            <Line key={rn} type="monotone" dataKey={rn} stroke={REF_COLORS[rn] || "#999"} strokeDasharray="5 4" dot={false} strokeWidth={1.5} isAnimationActive={false} />
                          ))}
                          <Line type="monotone" dataKey="MiSIR" stroke={MISIR_BLUE} strokeWidth={2.5} dot={{ r: 3.5 }} isAnimationActive={false} />
                        </LineChart>
                      </ResponsiveContainer>
                    )}
                  </div>

                  <div style={{ background: "#fff", borderRadius: 12, border: "1px solid #E2E8ED", padding: "20px 20px 8px" }}>
                    <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 4 }}>เปรียบเทียบรายปี — {selectedProc}</div>
                    <ResponsiveContainer width="100%" height={340}>
                      <BarChart data={yearlyAll[selectedProc] || []} margin={{ top: 20, right: 24, left: 8, bottom: 8 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#EEF2F4" vertical={false} />
                        <XAxis dataKey="year" tick={{ fontSize: 11, fill: "#5B6B75" }} />
                        <YAxis tick={{ fontSize: 11, fill: "#5B6B75" }} label={{ value: "DAP (Gy cm2)", angle: -90, position: "insideLeft", fontSize: 11, fill: "#5B6B75" }} />
                        <Tooltip contentStyle={{ borderRadius: 8, border: "1px solid #E2E8ED", fontSize: 12.5 }} />
                        <Legend wrapperStyle={{ fontSize: 12 }} />
                        <Bar dataKey="MiSIR" fill={CORAL} radius={[3, 3, 0, 0]} />
                        {DRLS_THAILAND.hasOwnProperty(selectedProc) && <Bar dataKey="DRLs" fill={DRL_GOLD} radius={[3, 3, 0, 0]} />}
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              )}
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const bootLoading = document.getElementById("boot-loading");
if (bootLoading) bootLoading.style.display = "none";
ReactDOM.createRoot(rootEl).render(<App />);

</script>

<script>
  (function () {
    var srcEl = document.getElementById("app-source");
    var code = srcEl.textContent;
    try {
      var out = Babel.transform(code, {
        presets: [["react", { runtime: "classic" }], "env"],
      }).code;
      var s = document.createElement("script");
      s.textContent = out;
      document.body.appendChild(s);
    } catch (err) {
      var loading = document.getElementById("boot-loading");
      if (loading) {
        loading.style.display = "flex";
        loading.textContent = "เกิดข้อผิดพลาดขณะโหลดแอป: " + err.message;
        loading.style.color = "#B91C1C";
      }
      console.error(err);
    }
  })();
</script>
</body>
</html>
